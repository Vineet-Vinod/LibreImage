<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LibreImage</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">LibreImage</div>
      <nav class="steps" aria-label="Pipeline stages">
        <button class="step active" data-stage="upload" type="button">Upload</button>
        <button class="step" data-stage="restore" type="button">Kontext</button>
        <button class="step" data-stage="inpaint" type="button">Inpaint</button>
        <button class="step" data-stage="sharpen" type="button">Sharpen</button>
        <button class="step" data-stage="final" type="button">Final</button>
      </nav>
      <div id="status" class="status">Starting session...</div>
    </header>

    <section id="upload" class="view upload-view active">
      <label class="dropzone" for="uploadInput">
        <input id="uploadInput" type="file" accept="image/*">
        <span class="drop-title">Drop or choose an image</span>
        <span class="drop-subtitle">Temporary work stays under the current local session.</span>
      </label>
      <div class="upload-library">
        <h2>Session Library</h2>
        <div id="uploadGrid" class="grid"></div>
      </div>
    </section>

    <section id="restore" class="view restore-view">
      <aside class="panel">
        <h2>Kontext Restore</h2>
        <label><span class="label-row">Prompt<span class="help-icon" tabindex="0" role="img" aria-label="Prompt help" data-tip="Text instruction for the restore. More specific wording pushes the edit more strongly.">?</span></span><textarea id="restorePrompt"></textarea></label>
        <label><span class="label-row">Negative Prompt<span class="help-icon" tabindex="0" role="img" aria-label="Negative prompt help" data-tip="What to avoid. Adding terms suppresses those artifacts, but too many can overconstrain the result.">?</span></span><textarea id="restoreNegative"></textarea></label>
        <div class="field-pair">
          <label><span class="label-row">Steps<span class="help-icon" tabindex="0" role="img" aria-label="Steps help" data-tip="Denoising iterations. Increasing can improve detail, but takes longer and may overwork the image.">?</span></span><input id="restoreSteps" type="number" min="1" max="80" value="24"></label>
          <label><span class="label-row">Seed<span class="help-icon" tabindex="0" role="img" aria-label="Seed help" data-tip="Random starting point. Increasing or changing it gives a different variation, not a stronger effect.">?</span></span><input id="restoreSeed" type="text" placeholder="random"></label>
        </div>
        <div class="field-pair">
          <label><span class="label-row">Guidance<span class="help-icon" tabindex="0" role="img" aria-label="Guidance help" data-tip="Prompt influence. Increasing follows the prompt more tightly, with higher risk of artificial changes.">?</span></span><input id="restoreGuidance" type="number" min="0" max="20" step="0.1" value="2.5"></label>
          <label><span class="label-row">Strength<span class="help-icon" tabindex="0" role="img" aria-label="Strength help" data-tip="How much the source can change. Increasing repairs harder but may alter identity or composition.">?</span></span><input id="restoreStrength" type="number" min="0" max="1" step="0.05" value="0.35"></label>
        </div>
        <label><span class="label-row">LoRA Scale<span class="help-icon" tabindex="0" role="img" aria-label="LoRA scale help" data-tip="Strength of loaded Kontext LoRA adapters. Increasing makes adapter behavior more dominant.">?</span></span><input id="restoreLora" type="number" min="0" max="2" step="0.05" value="1"></label>
        <button id="runRestore" class="primary" type="button">Run Kontext</button>
      </aside>
      <section class="preview">
        <div id="restoreShell" class="image-shell restore-shell"><img id="restoreImage" alt=""></div>
        <div class="preview-actions">
          <button id="restoreUseLatest" type="button">Use Latest Result</button>
          <button class="danger" data-delete-current="restore" type="button">Delete Selected</button>
        </div>
      </section>
    </section>

    <section id="inpaint" class="view editor-view">
      <aside class="panel">
        <h2>Inpaint</h2>
        <label><span class="label-row">Prompt<span class="help-icon" tabindex="0" role="img" aria-label="Prompt help" data-tip="Instruction for the painted area. More specific wording steers the fill more strongly.">?</span></span><textarea id="inpaintPrompt"></textarea></label>
        <label><span class="label-row">Negative Prompt<span class="help-icon" tabindex="0" role="img" aria-label="Negative prompt help" data-tip="What to avoid in the fill. Adding terms suppresses them, but too many can make results rigid.">?</span></span><textarea id="inpaintNegative"></textarea></label>
        <div class="field-pair">
          <label><span class="label-row">Steps<span class="help-icon" tabindex="0" role="img" aria-label="Steps help" data-tip="Denoising iterations. Increasing can refine the fill, but takes longer and may add artifacts.">?</span></span><input id="inpaintSteps" type="number" min="1" max="80" value="28"></label>
          <label><span class="label-row">Seed<span class="help-icon" tabindex="0" role="img" aria-label="Seed help" data-tip="Random starting point. Increasing or changing it gives a different fill variation.">?</span></span><input id="inpaintSeed" type="text" placeholder="random"></label>
        </div>
        <div class="field-pair">
          <label><span class="label-row">Guidance<span class="help-icon" tabindex="0" role="img" aria-label="Guidance help" data-tip="Prompt influence. Increasing follows the prompt more closely, sometimes less naturally.">?</span></span><input id="inpaintGuidance" type="number" min="0" max="20" step="0.1" value="3.5"></label>
          <label><span class="label-row">Strength<span class="help-icon" tabindex="0" role="img" aria-label="Strength help" data-tip="How much the masked area is regenerated. Increasing replaces more aggressively.">?</span></span><input id="inpaintStrength" type="number" min="0" max="1" step="0.05" value="0.9"></label>
        </div>
        <button id="runInpaint" class="primary" type="button">Run Inpaint</button>
      </aside>
      <section class="compare">
        <div class="canvas-card">
          <div class="toolrow">
            <button id="brushBtn" class="active" type="button">Brush</button>
            <button id="eraseBtn" type="button">Eraser</button>
            <button id="clearMask" type="button">Clear</button>
            <label class="range"><span class="label-row">Size<span class="help-icon" tabindex="0" role="img" aria-label="Brush size help" data-tip="Brush diameter for mask painting. Increasing covers a larger area per stroke.">?</span></span><input id="brushSize" type="range" min="4" max="180" value="48"></label>
          </div>
          <canvas id="maskCanvas"></canvas>
        </div>
        <div class="image-shell"><img id="inpaintResult" alt=""></div>
      </section>
      <div id="inpaintGallery" class="filmstrip"></div>
    </section>

    <section id="sharpen" class="view editor-view">
      <aside class="panel">
        <h2>Sharpen</h2>
        <label><span class="label-row">Radius<span class="help-icon" tabindex="0" role="img" aria-label="Radius help" data-tip="Edge width affected by sharpening. Increasing sharpens broader edges and can create halos.">?</span></span><input id="sharpRadius" type="number" min="0.1" max="5" step="0.1" value="1.4"></label>
        <label><span class="label-row">Amount<span class="help-icon" tabindex="0" role="img" aria-label="Amount help" data-tip="Sharpening intensity. Increasing makes details crisper, but can amplify noise.">?</span></span><input id="sharpAmount" type="number" min="0" max="4" step="0.05" value="1.15"></label>
        <label><span class="label-row">Threshold<span class="help-icon" tabindex="0" role="img" aria-label="Threshold help" data-tip="Minimum contrast before sharpening applies. Increasing protects smooth areas but may skip fine detail.">?</span></span><input id="sharpThreshold" type="number" min="0" max="32" value="3"></label>
        <label><span class="label-row">Contrast<span class="help-icon" tabindex="0" role="img" aria-label="Contrast help" data-tip="Global contrast adjustment. Increasing deepens shadows and brightens highlights.">?</span></span><input id="sharpContrast" type="number" min="0.5" max="1.8" step="0.01" value="1.02"></label>
        <label><span class="label-row">Color<span class="help-icon" tabindex="0" role="img" aria-label="Color help" data-tip="Color saturation multiplier. Increasing makes colors stronger and can look oversaturated.">?</span></span><input id="sharpColor" type="number" min="0" max="1.8" step="0.01" value="1"></label>
        <button id="runSharpen" class="primary" type="button">Run Sharpen</button>
        <button class="danger" data-delete-current="sharpen" type="button">Delete Selected</button>
      </aside>
      <section class="compare">
        <div class="image-shell"><img id="sharpenSource" alt=""></div>
        <div class="image-shell"><img id="sharpenResult" alt=""></div>
      </section>
      <div id="sharpenGallery" class="filmstrip"></div>
    </section>

    <section id="final" class="view final-view">
      <div class="slideshow">
        <button id="prevImage" class="arrow" type="button" aria-label="Previous image">&lt;</button>
        <div class="image-shell"><img id="finalImage" alt=""></div>
        <button id="nextImage" class="arrow" type="button" aria-label="Next image">&gt;</button>
      </div>
      <aside class="final-panel">
        <h2 id="finalTitle">No image selected</h2>
        <button id="saveCurrent" class="primary" type="button">Save Current To Folder</button>
        <button id="saveAll" type="button">Save All To Folder</button>
        <button id="restartFromFinal" type="button">Restart From This Image</button>
        <button class="danger" data-delete-current="final" type="button">Delete Selected</button>
      </aside>
      <div id="finalGallery" class="filmstrip"></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
