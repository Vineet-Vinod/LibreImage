[project]
name = "libreimage"
version = "0.1.0"
description = "Local network web app for image restoration workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=0.31",
    "diffusers>=0.36",
    "fastapi>=0.111",
    "huggingface-hub>=0.23",
    "numpy>=1.26",
    "pillow>=10.3",
    "python-multipart>=0.0.9",
    "safetensors>=0.4",
    "torch>=2.3",
    "transformers>=4.41",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
libre-web = "libreimage.web:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libreimage"]
include = ["src/libreimage/static/*"]
